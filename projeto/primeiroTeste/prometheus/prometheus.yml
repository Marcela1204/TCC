# prometheus/prometheus.yml
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'ids_core'
    static_configs:
      - targets: ['localhost:8000']

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']  # Node Exporter

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

rule_files:
  - "alerts.yml"